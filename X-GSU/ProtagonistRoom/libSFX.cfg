; libSFX Configuration - ProtagonistRoom ("A nice little room for our protagonist")

;-------------------------------------------------------------------------------
;ROM Header

;Title (21 chars)
;                      "123456789012345678901"
define "ROM_TITLE",    "PROTAGONIST ROOM     "

;ROM map mode: $0 = Mode 20 "LoROM"
ROM_MAPMODE = $0

;ROM speed: $1 = Fast (120ns)
ROM_SPEED = $1

;Chipset: $17 = ROM + SuperFX3 + RAM
ROM_CHIPSET = $17

;ROM Size: $08 = 2 Mbit (256 KB across 8 * 32 KB LoROM banks $80..$87)
ROM_ROMSIZE = $08

;Expansion RAM Size: $07 = 1 Mbit (128 KB Game Pak RAM across $70..$71)
ROM_EXPRAMSIZE = $07

; Perform joypad read-out before NMI trampoline call to minimize input latency
SFX_AUTO_READOUT_FIRST = YES
